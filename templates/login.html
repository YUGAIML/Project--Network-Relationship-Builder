<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Neural Nexus</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-circle-nodes"></i>
                <span>Neural Nexus</span>
            </div>

            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/register">Register</a></li>
            </ul>
        </nav>
    </header>

    <!-- ================= LOGIN SECTION ================= -->

    <section class="login-section">

        <div class="login-card">

            <div class="card-header">
                <div class="icon">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>
                    Login to continue to the Network Relationship Management System.
                </p>
            </div>

            {% with messages = get_flashed_messages() %}
            {% if messages %}
            {% for message in messages %}
            <div class="message">
                <i class="fa-solid fa-circle-info" style="margin-right: 6px;"></i> {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form action="/login" method="POST">

                <div class="input-box">
                    <label for="email">
                        <i class="fa-solid fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="input-box">
                    <label for="password">
                        <i class="fa-solid fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-btn">
                    Login <i class="fa-solid fa-arrow-right-to-bracket" style="margin-left: 6px;"></i>
                </button>

            </form>

            <div class="bottom-text">
                Don't have an account? <a href="/register">Register Here</a>
            </div>

        </div>

    </section>

</body>

</html>
