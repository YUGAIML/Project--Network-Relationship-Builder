<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Neural Nexus</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-circle-nodes"></i>
                <span>Neural Nexus</span>
            </div>

            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/login">Login</a></li>
            </ul>
        </nav>
    </header>

    <!-- ================= REGISTER SECTION ================= -->

    <section class="register-section">

        <div class="register-card">

            <div class="card-header">
                <div class="icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2>Create Account</h2>
                <p>
                    Register to access the Network Relationship Management System.
                </p>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            {% for message in messages %}
            <div class="message">
                <i class="fa-solid fa-circle-info" style="margin-right: 6px;"></i> {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form action="/register" method="POST">

                <div class="input-box">
                    <label for="fullname">
                        <i class="fa-solid fa-user"></i> Full Name
                    </label>
                    <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
                </div>

                <div class="input-box">
                    <label for="email">
                        <i class="fa-solid fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="input-box">
                    <label for="password">
                        <i class="fa-solid fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" placeholder="Create password" required>
                </div>

                <div class="input-box">
                    <label for="confirm_password">
                        <i class="fa-solid fa-shield-halved"></i> Confirm Password
                    </label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" required>
                </div>

                <button type="submit" class="register-btn">
                    Create Account <i class="fa-solid fa-arrow-right" style="margin-left: 6px;"></i>
                </button>

            </form>

            <div class="bottom-text">
                Already have an account? <a href="/login">Login Here</a>
            </div>

        </div>

    </section>

</body>

</html>
